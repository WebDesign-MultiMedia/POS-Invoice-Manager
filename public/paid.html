<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Payment received</title>
    <!-- Where Stripe sends a customer after paying by QR at an event.
         Public on purpose (the customer isn't logged in), so it shows
         nothing about the order. -->
    <style>
      :root { color-scheme: light dark; --bg: #f4f6fb; --card: #ffffff; --text: #1f2937; --muted: #4b5563; --ok: #059669; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0b1220; --card: #111a2e; --text: #f1f5f9; --muted: #cbd5e1; --ok: #34d399; } }
      html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; box-sizing: border-box; }
      .card { background: var(--card); border-radius: 20px; padding: 32px 24px; max-width: 380px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12); }
      svg { width: 64px; height: 64px; color: var(--ok); }
      h1 { font-size: 1.5rem; margin: 12px 0 8px; }
      p { margin: 0 0 8px; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10" />
          <path d="M7.5 12.5l3 3 6-6.5" />
        </svg>
        <h1>Payment received</h1>
        <p>Thank you! Your payment went through.</p>
        <p>You can show this screen to the staff. You can close this page now.</p>
      </div>
    </main>
  </body>
</html>
